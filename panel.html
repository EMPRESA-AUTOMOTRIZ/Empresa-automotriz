
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Menú principal | AutoPartes Pro</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fa;
      color: #17243a;
    }

    #estado {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101827;
      color: white;
      text-align: center;
      padding: 25px;
    }

    #contenido {
      display: none;
      min-height: 100vh;
    }

    .sidebar {
      width: 250px;
      background: #101827;
      color: white;
      padding: 25px 15px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .logo {
      text-align: center;
      padding: 15px 5px;
    }

    .logo-icono {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .logo h2 {
      margin: 0;
      color: white;
      font-size: 21px;
    }

    .logo p {
      font-size: 12px;
      color: #aebbd0;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .menu button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #e0e7f1;
      text-align: left;
      font-size: 14px;
      cursor: pointer;
    }

    .menu button:hover {
      background: #243550;
    }

    .menu button.activo {
      background: #284b80;
      color: white;
    }

    .menu button span {
      margin-right: 10px;
      font-size: 18px;
    }

    #menuUsuarios {
      display: none;
    }

    .salir {
      margin-top: auto;
      padding: 13px;
      border: 1px solid #45536a;
      border-radius: 8px;
      background: transparent;
      color: white;
      cursor: pointer;
      text-align: left;
    }

    .salir:hover {
      background: #9c3030;
    }

    .principal {
      flex: 1;
      min-width: 0;
    }

    header {
      background: white;
      padding: 25px 35px;
      border-bottom: 1px solid #e2e6ed;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    .usuario {
      font-size: 13px;
      color: #66758c;
      text-align: right;
    }

    main {
      padding: 35px;
      max-width: 1200px;
      margin: auto;
    }

    .bienvenida {
      background: #ffffff;
      border-radius: 16px;
      padding: 35px;
      border: 1px solid #e2e6ed;
      margin-bottom: 25px;
    }

    .bienvenida h2 {
      color: #ff8c00;
      font-size: 29px;
      margin-top: 0;
    }

    .bienvenida p {
      color: #5d6a7d;
      line-height: 1.7;
    }

    .tarjetas {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .tarjeta {
      background: white;
      padding: 25px;
      border-radius: 14px;
      border: 1px solid #e2e6ed;
      cursor: pointer;
      text-align: left;
      font: inherit;
      color: inherit;
    }

    .tarjeta:hover {
      border-color: #ff8c00;
    }

    .tarjeta .icono {
      font-size: 30px;
      margin-bottom: 15px;
    }

    .tarjeta h3 {
      margin: 0 0 10px;
    }

    .tarjeta p {
      font-size: 13px;
      color: #748094;
      line-height: 1.5;
    }

    .detalle {
      background: white;
      padding: 35px;
      border-radius: 15px;
      border: 1px solid #e2e6ed;
    }

    .detalle h2 {
      color: #ff8c00;
    }

    .detalle p {
      line-height: 1.7;
      color: #5d6a7d;
    }

    .enlace {
      display: inline-block;
      background: #ff8c00;
      color: #101827;
      padding: 13px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 15px;
    }

    .oculto {
      display: none;
    }

    @media (max-width: 760px) {
      #contenido {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        padding: 15px;
      }

      .logo {
        padding: 5px;
      }

      .logo-icono {
        font-size: 30px;
      }

      .menu {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
      }

      .menu button {
        font-size: 12px;
      }

      header {
        padding: 20px;
      }

      header h1 {
        font-size: 20px;
      }

      main {
        padding: 20px;
      }

      .bienvenida {
        padding: 25px;
      }
    }
  </style>
</head>

<body>
  <div id="estado">Verificando acceso seguro...</div>

  <div id="contenido">
    <aside class="sidebar">
      <div class="logo">
        <div class="logo-icono">⚙️</div>
        <h2>AUTOPARTES PRO</h2>
        <p>Tu auto, en buenas manos</p>
      </div>

      <nav class="menu" aria-label="Menú principal">
        <button class="activo" data-seccion="inicio">
          <span>🏠</span> Inicio
        </button>

        <button data-seccion="clientes">
          <span>👥</span> Clientes
        </button>

        <button data-seccion="almacen">
          <span>🏬</span> Almacén
        </button>

        <button data-seccion="inventario">
          <span>📦</span> Inventario
        </button>

        <button data-seccion="ventas">
          <span>📈</span> Ventas
        </button>

        <button data-seccion="entregas">
          <span>🚚</span> Entregas
        </button>

        <button id="menuUsuarios"
                data-seccion="usuarios">
          <span>🛡️</span> Usuarios y seguridad
        </button>

        <button data-seccion="reportes">
          <span>📊</span> Reportes
        </button>

        <button data-seccion="configuracion">
          <span>⚙️</span> Configuración
        </button>
      </nav>

      <button id="salir" class="salir">
        🚪 Cerrar sesión
      </button>
    </aside>

    <div class="principal">
      <header>
        <h1 id="tituloPagina">Menú principal</h1>

        <div class="usuario">
          <div id="nombreUsuario"></div>
          <div id="rolUsuario"></div>
        </div>
      </header>

      <main>
        <section id="inicio">
          <div class="bienvenida">
            <h2>¡Bienvenido a AutoPartes Pro!</h2>
            <p id="bienvenida"></p>
            <p>
              Selecciona una opción del menú para
              acceder a las herramientas de trabajo.
            </p>
          </div>

          <div class="tarjetas">
            <button class="tarjeta" data-seccion="clientes">
              <div class="icono">👥</div>
              <h3>Clientes</h3>
              <p>Acceso al apartado de clientes.</p>
            </button>

            <button class="tarjeta" data-seccion="almacen">
              <div class="icono">🏬</div>
              <h3>Almacén</h3>
              <p>Acceso al apartado de almacén.</p>
            </button>

            <button class="tarjeta" data-seccion="inventario">
              <div class="icono">📦</div>
              <h3>Inventario</h3>
              <p>Acceso al apartado de inventario.</p>
            </button>

            <button class="tarjeta" data-seccion="ventas">
              <div class="icono">📈</div>
              <h3>Ventas</h3>
              <p>Acceso al apartado de ventas.</p>
            </button>

            <button class="tarjeta" data-seccion="entregas">
              <div class="icono">🚚</div>
              <h3>Entregas</h3>
              <p>Acceso al apartado de entregas.</p>
            </button>

            <button class="tarjeta" data-seccion="reportes">
              <div class="icono">📊</div>
              <h3>Reportes</h3>
              <p>Acceso al apartado de reportes.</p>
            </button>
          </div>
        </section>

        <section id="detalle" class="detalle oculto">
          <h2 id="tituloDetalle"></h2>
          <p id="textoDetalle"></p>

          <a id="enlaceUsuarios"
             href="usuarios.html"
             class="enlace oculto">
            Administrar empleados
          </a>
        </section>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <script>
    let rolActual = null;

    const nombresSecciones = {
      inicio: "Menú principal",
      clientes: "Clientes",
      almacen: "Almacén",
      inventario: "Inventario",
      ventas: "Ventas",
      entregas: "Entregas",
      usuarios: "Usuarios y seguridad",
      reportes: "Reportes",
      configuracion: "Configuración"
    };

    function mostrarSeccion(seccion) {
      if (!nombresSecciones[seccion]) return;

      if (
        seccion === "usuarios" &&
        !["programador", "administrador"].includes(rolActual)
      ) {
        return;
      }

      document.getElementById("tituloPagina")
        .textContent = nombresSecciones[seccion];

      document.querySelectorAll(".menu button")
        .forEach(boton => {
          boton.classList.toggle(
            "activo",
            boton.dataset.seccion === seccion
          );
        });

      const esInicio = seccion === "inicio";

      document.getElementById("inicio")
        .classList.toggle("oculto", !esInicio);

      document.getElementById("detalle")
        .classList.toggle("oculto", esInicio);

      if (esInicio) return;

      document.getElementById("tituloDetalle")
        .textContent = nombresSecciones[seccion];

      const esUsuarios = seccion === "usuarios";

      document.getElementById("textoDetalle")
        .textContent = esUsuarios
          ? "Administración de cuentas, roles y permisos. " +
            "Esta función se encuentra en desarrollo."
          : "Este apartado está preparado para integrar " +
            "las funciones correspondientes del sistema.";

      document.getElementById("enlaceUsuarios")
        .classList.toggle("oculto", !esUsuarios);
    }

    document.querySelectorAll("[data-seccion]")
      .forEach(boton => {
        boton.addEventListener("click", () => {
          mostrarSeccion(boton.dataset.seccion);
        });
      });

    async function verificarAcceso() {
      try {
        const { data, error } =
          await supabaseClient.auth.getUser();

        if (error || !data.user) {
          window.location.replace("login.html");
          return;
        }

        const { data: perfil, error: errorPerfil } =
          await supabaseClient
            .from("profiles")
            .select("full_name, role")
            .eq("id", data.user.id)
            .single();

        if (
          errorPerfil ||
          !perfil ||
          !["programador", "administrador", "usuario"]
            .includes(perfil.role)
        ) {
          await supabaseClient.auth.signOut();
          window.location.replace("login.html");
          return;
        }

        rolActual = perfil.role;

        const nombre =
          perfil.full_name || data.user.email;

        document.getElementById("nombreUsuario")
          .textContent = nombre;

        document.getElementById("rolUsuario")
          .textContent = "Rol: " + perfil.role;

        document.getElementById("bienvenida")
          .textContent =
            "Has iniciado sesión correctamente, " + nombre + ".";

        if (
          ["programador", "administrador"]
            .includes(perfil.role)
        ) {
          document.getElementById("menuUsuarios")
            .style.display = "block";
        }

        document.getElementById("estado")
          .style.display = "none";

        document.getElementById("contenido")
          .style.display = "flex";

      } catch (error) {
        console.error("Error verificando acceso:", error);

        document.getElementById("estado")
          .textContent =
            "No se pudo verificar el acceso. " +
            "Recarga la página.";
      }
    }

    document.getElementById("salir")
      .addEventListener("click", async () => {
        const { error } =
          await supabaseClient.auth.signOut();

        if (error) {
          alert("No se pudo cerrar la sesión. Intenta nuevamente.");
          return;
        }

        window.location.replace("login.html");
      });

    verificarAcceso();
  </script>
</body>
</html>
