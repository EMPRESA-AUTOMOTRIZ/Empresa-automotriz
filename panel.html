
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Panel | AutoPartes Pro</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      background: #1c293b;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1, h2 { color: #ff8c00; }

    main {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }

    .tarjetas {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .tarjeta {
      background: #1c293b;
      padding: 25px;
      border-radius: 12px;
    }

    button {
      background: #ff8c00;
      border: none;
      padding: 12px 18px;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
    }

    #contenido { display: none; }

    #estado {
      text-align: center;
      padding: 40px;
    }
    
    #estado {
      text-align: center;
      padding: 40px;
    }

    .enlace {
      display: inline-block;
      background: #ff8c00;
      color: #101827;
      padding: 12px 18px;
      border-radius: 7px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <p id="estado">Verificando acceso...</p>

  <div id="contenido">
    <header>
      <h2>AutoPartes Pro</h2>
      <button id="salir">Cerrar sesión</button>
    </header>

    <main>
      <h1>Panel principal</h1>
      <p id="bienvenida"></p>
      <p id="rol"></p>

      <section class="tarjetas">
        <div class="tarjeta">
          <h2>Inventario</h2>
          <p>Próximamente</p>
        </div>

        <div class="tarjeta">
          <h2>Ventas</h2>
          <p>Próximamente</p>
        </div>

        <div class="tarjeta">
          <h2>Productos</h2>
          <p>Próximamente</p>
        </div>

        
<div class="tarjeta" id="tarjetaEmpleados"
     style="display: none;">
  <h2>Empleados</h2>
  <p>Administración del personal</p>
  <a href="usuarios.html" class="enlace">
    Administrar empleados
  </a>
</div>

      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <script>
    async function verificarAcceso() {
      try {
        const { data, error } =
          await supabaseClient.auth.getUser();

        if (error || !data.user) {
          window.location.replace("login.html");
          return;
        }

        const { data: perfil, error: errorPerfil } =
          await supabaseClient
            .from("profiles")
            .select("full_name, role")
            .eq("id", data.user.id)
            .single();

        if (errorPerfil || !perfil ||
            !["programador", "administrador", "usuario"]
              .includes(perfil.role)) {
          await supabaseClient.auth.signOut();
          window.location.replace("login.html");
          return;
        }

        document.getElementById("bienvenida")
          .textContent =
          "Bienvenido, " +
          (perfil.full_name || data.user.email);

        document.getElementById("rol")
          .textContent = "Rol: " + perfil.role;
        
if (["programador", "administrador"].includes(perfil.role)) {
  document.getElementById("tarjetaEmpleados")
    .style.display = "block";
}


        document.getElementById("estado")
          .style.display = "none";

        document.getElementById("contenido")
          .style.display = "block";

      } catch (error) {
        document.getElementById("estado")
          .textContent =
          "No se pudo verificar el acceso. Recarga la página.";
      }
    }

    document.getElementById("salir")
      .addEventListener("click", async () => {
        await supabaseClient.auth.signOut();
        window.location.replace("login.html");
      });

    verificarAcceso();
  </script>
</body>
</html>
