
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | AutoPartes Pro</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #101827;
      font-family: Arial, sans-serif;
      color: white;
    }

    .login {
      background: #1c293b;
      width: 90%;
      max-width: 400px;
      padding: 35px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 10px 30px #0005;
    }

    h1 {
      color: #ff8c00;
      margin-bottom: 8px;
    }

    p {
      color: #b9c3d0;
    }

    label {
      display: block;
      text-align: left;
      margin: 18px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #435169;
      border-radius: 7px;
      background: #101827;
      color: white;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #ff8c00;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      background: #ff8c00;
      color: #101827;
      border: none;
      border-radius: 7px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #ffa333;
    }

    a {
      display: inline-block;
      margin-top: 22px;
      color: #ff8c00;
      text-decoration: none;
    }

    #mensaje {
      color: #ffb5b5;
      min-height: 20px;
    }
  </style>
  
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

</head>

<body>
  <main class="login">
    <h1>AutoPartes Pro</h1>
    <p>Acceso para personal autorizado</p>

    <form id="formLogin">
      <label for="correo">Correo electrónico</label>
      <input
        type="email"
        id="correo"
        placeholder="correo@empresa.com"
        autocomplete="username"
        required
      >

      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        placeholder="Ingresa tu contraseña"
        autocomplete="current-password"
        required
      >

      <button type="submit">Iniciar sesión</button>
      
<div class="cf-turnstile"
     data-sitekey="0x4AAAAAAF5h883YM38NRuLk"></div>

    </form>

    <p id="mensaje" role="status"></p>

    <a href="index.html">Volver al inicio</a>
  </main>

  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
  const formulario = document.getElementById("formLogin");
  const mensaje = document.getElementById("mensaje");
  const boton = formulario.querySelector("button");

  formulario.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = document.getElementById("correo").value.trim();
    const password = document.getElementById("password").value;

    boton.disabled = true;
    mensaje.textContent = "Verificando acceso...";

    try {   
const captchaToken =
  window.turnstile?.getResponse();

if (!captchaToken) {
  mensaje.textContent =
    "Completa la verificación de seguridad.";
  return;
}

const { data, error } =
  await supabaseClient.auth.signInWithPassword({
    email,
    password,
    options: {
      captchaToken: captchaToken
    }
  });


      if (error || !data.user) {
        mensaje.textContent =
          "No se pudo iniciar sesión. Revisa tus datos.";
        return;
      }

      const { data: perfil, error: errorPerfil } =
        await supabaseClient
          .from("profiles")
          .select("role")
          .eq("id", data.user.id)
          .single();

      if (errorPerfil || !perfil) {
        await supabaseClient.auth.signOut();
        mensaje.textContent =
          "No se pudo verificar tu perfil.";
        return;
      }

      if (!["programador", "administrador", "usuario"]
          .includes(perfil.role)) {
        await supabaseClient.auth.signOut();
        mensaje.textContent = "Acceso no autorizado.";
        return;
      }

      window.location.replace("panel.html");

    } catch (error) {
      mensaje.textContent =
        "Error de conexión. Intenta nuevamente.";
    } finally {
      boton.disabled = false;
    }
  });
</script>
